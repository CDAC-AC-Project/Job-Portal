jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8081

spring:
  application:
    name: AUTH-USER-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 09082003

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # username/password have no default on purpose — they must come from real
  # env vars (MAIL_USERNAME / MAIL_PASSWORD) so a mailbox credential is never
  # hardcoded in this file. If they're unset, the app fails fast on startup.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: DEBUG

app:
  # Used to build the verify-email / reset-password links sent in emails. Set to the
  # PC's LAN IP (not localhost) since these links are opened from a phone's mail app,
  # which has no access to the PC's own loopback address.
  frontend-base-url: ${FRONTEND_BASE_URL:http://192.168.0.102:5173}
  email-verification-expiry-minutes: 1440
  password-reset-expiry-minutes: 30
  refresh-token-expiry-days: 7
